<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>figalign</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #fffefb;
    --line: #e4e0d7;
    --line-soft: #efece4;
    --text: #3f3d38;
    --dim: #8c877b;
    --accent: #6f8fa3;
    --accent-soft: #eef2f4;
    --error: #9c5346;
    --error-bg: #fbf3f1;
    --error-line: #e6cfc9;
    --ok: #7a9a72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.55 -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { font-weight: 600; letter-spacing: .01em; }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  label { color: var(--dim); }
  select, input, button {
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 7px;
  }
  input { width: 74px; }
  button { cursor: pointer; }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  a { color: var(--accent); }
  .spacer { flex: 1; }
  #size-fields[hidden] { display: none; }

  #link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dim);
    font-size: 12px;
  }
  #link::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dim);
  }
  #link.live::before { background: var(--ok); }
  #link.down::before { background: var(--error); }

  main {
    flex: 1;
    overflow: auto;
    display: grid;
    place-items: center;
    padding: 36px;
  }
  #stage {
    background: #fff;
    border: 1px solid var(--line-soft);
    box-shadow: 0 1px 3px rgba(60,55,45,.06), 0 8px 28px rgba(60,55,45,.05);
  }
  #stage svg { display: block; }
  #stage.stale { opacity: .55; transition: opacity .12s; }

  #error {
    display: none;
    position: fixed;
    left: 16px; right: 16px; bottom: 34px;
    max-height: 42vh;
    overflow: auto;
    white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid var(--error-line);
    border-radius: 7px;
    padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(60,55,45,.08);
  }
  #error.on { display: block; }
  #error .close {
    float: right;
    color: var(--dim);
    cursor: pointer;
    padding: 0 4px;
  }

  footer {
    padding: 5px 16px;
    color: var(--dim);
    background: var(--surface);
    border-top: 1px solid var(--line);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <span class="brand">figalign<small id="preset"></small></span>
  <label>view <select id="panel"></select></label>
  <span id="size-fields">
    <label>w <input id="w" value=""></label>
    <label>h <input id="h" value=""></label>
  </span>
  <button id="reload">redraw</button>
  <span class="spacer"></span>
  <a id="pdf" href="#" target="_blank">PDF</a>
  <a id="svg" href="/api/figure.svg" target="_blank">SVG</a>
  <span id="link">watch</span>
</header>

<main>
  <div id="stage"></div>
</main>

<pre id="error"><span class="close" id="error-close">×</span><span id="error-body"></span></pre>
<footer id="status">読み込み中…</footer>

<script>
const $ = (id) => document.getElementById(id);
const FIGURE = "__figure__";
const SCOPE_LABEL = { layout: "レイアウト", code: "コード", data: "データ" };
let spec = null;
let drawing = false;
let pending = false;

function status(text) { $("status").textContent = text; }

function showError(text) {
  // Never blank the preview: the last good render stays under the banner (spec 7.3).
  $("error-body").textContent = text;
  $("error").classList.add("on");
}
function clearError() { $("error").classList.remove("on"); }

$("error-close").addEventListener("click", clearError);

async function loadSpec() {
  const res = await fetch("/api/spec");
  if (!res.ok) {
    showError((await res.json()).detail ?? res.statusText);
    status("fig.toml を読めない");
    return false;
  }
  const next = await res.json();
  const first = spec === null;
  spec = next;
  $("preset").textContent =
    `${spec.preset.name} / ${spec.figure.width_mm.toFixed(1)}×${spec.figure.height_mm.toFixed(1)}mm / ${spec.preset.font_size_pt}pt`;

  const keep = $("panel").value;
  $("panel").innerHTML =
    `<option value="${FIGURE}">figure (合成)</option>` +
    spec.panels
      .map((p) => `<option value="${p.name}">${spec.labels[p.name] ?? "-"}: ${p.name} — ${p.ref}</option>`)
      .join("");
  if (keep && [...$("panel").options].some((o) => o.value === keep)) $("panel").value = keep;
  if (first) {
    $("w").value = `${spec.preset.width_mm}mm`;
    $("h").value = `${spec.default_height_mm}mm`;
  }
  return true;
}

function isFigure() { return $("panel").value === FIGURE; }

async function draw(note = "") {
  if (drawing) { pending = true; return; }
  drawing = true;
  const figure = isFigure();
  const name = $("panel").value;
  $("size-fields").hidden = figure;  // when composing, the solver owns the size
  const query = new URLSearchParams({ w: $("w").value, h: $("h").value });
  const url = figure ? "/api/figure.svg" : `/api/panel/${name}.svg?${query}`;
  $("pdf").href = figure ? "/api/figure.pdf" : `/api/panel/${name}.pdf?${query}`;

  $("stage").classList.add("stale");
  const t0 = performance.now();
  let res, body;
  try {
    res = await fetch(url);
    body = await res.text();
  } catch (err) {
    $("stage").classList.remove("stale");
    drawing = false;
    status(`サーバーに繋がらない: ${err}`);
    return;
  }
  const ms = Math.round(performance.now() - t0);
  $("stage").classList.remove("stale");

  if (res.ok) {
    clearError();
    // spec 7.2: drop the output SVG straight into the DOM
    $("stage").innerHTML = body;
    const failed = (res.headers.get("X-Figalign-Errors") || "").split(",").filter(Boolean);
    if (failed.length) showError(`描画に失敗したパネル: ${failed.join(", ")}\n(該当セルにトレースバックを表示)`);
    const passes = res.headers.get("X-Figalign-Passes");
    const conv = res.headers.get("X-Figalign-Converged");
    const align = figure && passes ? ` — 整列${passes}パス${conv === "0" ? " (未収束)" : ""}` : "";
    status(`${figure ? "figure" : name} — ${ms}ms — 実寸表示${align}${note}`);
  } else {
    let detail = body;
    try { detail = JSON.parse(body).detail ?? body; } catch (_) {}
    showError(detail);
    status(`失敗: ${figure ? "figure" : name} — ${ms}ms${note}`);
  }

  drawing = false;
  if (pending) { pending = false; draw(note); }
}

function connect(delay = 500) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${proto}://${location.host}/ws`);

  socket.addEventListener("open", () => {
    $("link").textContent = "watching";
    $("link").className = "live";
  });
  socket.addEventListener("message", async (event) => {
    const msg = JSON.parse(event.data);
    if (msg.kind !== "change") return;
    const label = SCOPE_LABEL[msg.scope] ?? msg.scope;
    // A layout change can add or remove panels, so the spec is re-read first.
    if (await loadSpec()) draw(` — ${label}の変更を反映 (${msg.paths.join(", ")})`);
  });
  socket.addEventListener("close", () => {
    $("link").textContent = "reconnecting";
    $("link").className = "down";
    setTimeout(() => connect(Math.min(delay * 2, 5000)), delay);
  });
  socket.addEventListener("error", () => socket.close());
}

$("panel").addEventListener("change", () => draw());
$("reload").addEventListener("click", () => draw());
for (const id of ["w", "h"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") draw(); });
}

loadSpec().then((ok) => { if (ok) draw(); connect(); });
</script>
</body>
</html>
