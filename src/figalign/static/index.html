<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>figalign</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #fbfcfe;
    --line: #d3dae3;
    --line-soft: #e4e9f0;
    --text: #263241;
    --dim: #6f7b8a;
    --accent: #3c7ba8;
    --accent-soft: #e5eef6;
    --error: #a63d52;
    --error-bg: #fbf0f3;
    --error-line: #e6c6d0;
    --ok: #3f8a7d;
    /* The one warm note in the palette, so "not at true size" cannot be mistaken for
       ordinary chrome. */
    --warn: #9a6a1f;
    --shadow: 30, 41, 59;
    --editor-w: 560px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.55 -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header, .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { font-weight: 600; }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  label { color: var(--dim); }
  select, input, button {
    font: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
  }
  input { width: 74px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  button:disabled { color: var(--dim); cursor: default; opacity: .6; }
  select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  header, .bar { border-color: var(--line); }
  a { color: var(--accent); }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }

  #zoom-note { font-size: 12px; color: var(--dim); min-width: 3.4em; }
  #zoom-note.scaled { color: var(--warn); font-weight: 600; }
  #link { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  #link::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  #link.live::before { background: var(--ok); }
  #link.down::before { background: var(--error); }

  #split { flex: 1; display: flex; min-height: 0; }
  main { flex: 1; min-width: 0; overflow: auto; display: flex; padding: 32px; }
  /* #zoomer carries the scaled footprint so the scrollbars are right; #frame is what gets
     transformed. An auto margin centres it while it fits and collapses to zero once it
     overflows, which keeps the left edge reachable. */
  #zoomer { margin: auto; flex: none; }
  #frame { position: relative; transform-origin: top left; width: max-content; }
  #stage {
    background: #fff;
    border: 1px solid var(--line-soft);
    box-shadow: 0 1px 2px rgba(var(--shadow), .07), 0 6px 20px rgba(var(--shadow), .06);
  }
  #stage svg { display: block; }
  #stage.stale { opacity: .55; transition: opacity .12s; }
  /* The preview is rendered at true size, so an overlay positioned in mm lands exactly
     on the box the solver computed. */
  #highlight {
    position: absolute;
    pointer-events: none;
    border: 1px solid var(--accent);
    background: rgba(60, 123, 168, .10);
    transition: all .12s ease-out;
  }
  #highlight.inner { border-style: dashed; background: none; }

  /* --- editor --- */
  /* Code wants height, so the editor takes a full-height column beside the preview
     rather than a strip underneath it. */
  #editor-pane {
    display: flex;
    flex-direction: column;
    /* Never grow or shrink: the width is whatever the divider was dragged to. */
    flex: none;
    width: var(--editor-w);
    min-width: 280px;
    max-width: 80vw;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  #divider {
    flex: 0 0 5px;
    cursor: col-resize;
    background: var(--line-soft);
  }
  #divider:hover, #divider.dragging { background: var(--accent); }
  body.dragging { cursor: col-resize; user-select: none; }
  #tabs {
    display: flex;
    gap: 2px;
    padding: 6px 10px 0;
    overflow-x: auto;
    flex: none;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .tab {
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 5px 5px 0 0;
    background: transparent;
    padding: 4px 11px;
    color: var(--dim);
    white-space: nowrap;
  }
  .tab.on { background: var(--surface); color: var(--text); font-weight: 600; }
  .tab .dot { color: var(--warn); margin-left: 5px; }
  #editor-host { flex: 1; overflow: hidden; position: relative; }
  #editor-host textarea {
    width: 100%; height: 100%; border: 0; padding: 10px 12px; resize: none;
    font: 12px/1.6 ui-monospace, Menlo, monospace;
  }
  .CodeMirror { height: 100%; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .editor-bar {
    border-bottom: none;
    border-top: 1px solid var(--line);
    font-size: 12px;
    flex: none;
    gap: 8px;
    padding: 8px 10px;
  }
  .editor-bar button { padding: 3px 6px; }
  .editor-bar .note { color: var(--dim); }
  .editor-bar .note.warn { color: var(--warn); }

  #error {
    display: none;
    position: fixed;
    left: 16px; right: 16px; bottom: 34px;
    max-height: 38vh; overflow: auto;
    white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    color: var(--error);
    background: var(--error-bg);
    border: 1px solid var(--error-line);
    border-radius: 6px;
    padding: 12px 14px;
    box-shadow: 0 6px 20px rgba(var(--shadow), .10);
    z-index: 5;
  }
  #error.on { display: block; }
  #error .close { float: right; color: var(--dim); cursor: pointer; padding: 0 4px; }

  footer {
    padding: 5px 16px; color: var(--dim); background: var(--surface);
    border-top: 1px solid var(--line); font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <span class="brand">figalign<small id="preset"></small></span>
  <label>view <select id="panel"></select></label>
  <span id="size-fields">
    <label>w <input id="w"></label>
    <label>h <input id="h"></label>
  </span>
  <button id="reload">redraw</button>
  <select id="zoom" title="Zoom">
    <option value="fit" selected>fit</option>
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1">100% true size</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <span id="zoom-note"></span>
  <select id="filter" title="Colour check">
    <option value="none">colour</option>
    <option value="grayscale">greyscale</option>
    <option value="protan">protanopia</option>
    <option value="deutan">deuteranopia</option>
    <option value="tritan">tritanopia</option>
  </select>
  <span class="spacer"></span>
  <button id="toggle-editor">editor</button>
  <a id="pdf" href="#" target="_blank">PDF</a>
  <a id="svg" href="/api/figure.svg" target="_blank">SVG</a>
  <span id="link">watch</span>
</header>

<div id="split">
  <div id="editor-pane">
    <div id="tabs"></div>
    <div id="editor-host"><textarea id="editor" spellcheck="false"></textarea></div>
    <div class="bar editor-bar">
      <button id="save">save (⌘S)</button>
      <button id="undo-save">undo</button>
      <button id="revert">reload</button>
      <span class="note" id="editor-note"></span>
      <span class="spacer"></span>
      <span class="note" id="editor-path"></span>
    </div>
  </div>
  <div id="divider" title="Drag to resize, double-click to reset"></div>
  <main>
    <div id="zoomer">
      <div id="frame">
        <div id="stage"></div>
        <div id="highlight" hidden></div>
      </div>
    </div>
  </main>
</div>

<pre id="error"><span class="close" id="error-close">×</span><span id="error-body"></span></pre>
<footer id="status">loading…</footer>

<!-- Colour-vision simulation. Matrices are the usual dichromat approximations; the point is
     to catch "two series that only differ in hue" before it is printed, not to be clinical. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="protan"><feColorMatrix type="matrix" values="
    0.567 0.433 0     0 0
    0.558 0.442 0     0 0
    0     0.242 0.758 0 0
    0     0     0     1 0"/></filter>
  <filter id="deutan"><feColorMatrix type="matrix" values="
    0.625 0.375 0   0 0
    0.700 0.300 0   0 0
    0     0.300 0.7 0 0
    0     0     0   1 0"/></filter>
  <filter id="tritan"><feColorMatrix type="matrix" values="
    0.950 0.050 0     0 0
    0     0.433 0.567 0 0
    0     0.475 0.525 0 0
    0     0     0     1 0"/></filter>
</defs></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/toml/toml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FIGURE = "__figure__";
const SCOPE_LABEL = { layout: "layout", code: "code", data: "data" };
const MODES = { ".py": "python", ".toml": "toml", ".svg": "xml" };

let spec = null;
let drawing = false;
let pending = false;
let tabs = [];          // { key, title, file, line }
let active = null;      // the current tab
const buffers = new Map();  // file -> { doc, digest, clean, diskDigest }
let cm = null;          // CodeMirror instance, or null when falling back to the textarea

function status(text) { $("status").textContent = text; }
function showError(text) {
  // Never blank the preview: the last good render stays under the banner (spec 7.3).
  $("error-body").textContent = text;
  $("error").classList.add("on");
}
function clearError() { $("error").classList.remove("on"); }
$("error-close").addEventListener("click", clearError);

/* ---------- metadata ---------- */

async function loadSpec() {
  const res = await fetch("/api/spec");
  if (!res.ok) {
    showError((await res.json()).detail ?? res.statusText);
    status("cannot read fig.toml");
    return false;
  }
  const first = spec === null;
  spec = await res.json();
  $("preset").textContent =
    `${spec.preset.name} / ${spec.figure.width_mm.toFixed(1)}×${spec.figure.height_mm.toFixed(1)}mm / ${spec.preset.font_size_pt}pt`;

  const keep = $("panel").value;
  $("panel").innerHTML =
    `<option value="${FIGURE}">figure (composed)</option>` +
    spec.panels.map((p) =>
      `<option value="${p.name}">${spec.labels[p.name] ?? "-"}: ${p.name} — ${p.ref}</option>`).join("");
  if (keep && [...$("panel").options].some((o) => o.value === keep)) $("panel").value = keep;
  if (first) {
    $("w").value = `${spec.preset.width_mm}mm`;
    $("h").value = `${spec.default_height_mm}mm`;
  }
  buildTabs(first);
  return true;
}

/* ---------- tabs ----------
   One tab per panel, as in spec 7.1, plus data and layout. A tab is a *view* of a file:
   several panels usually live in the same panels.py, so they share one buffer and the tab
   only decides where to scroll. Sharing matters -- with a buffer per tab, saving from one
   would discard what was typed in another. */

function buildTabs(first) {
  const dataFile = spec.data_ref ? spec.data_ref.split(":")[0] : null;
  const dataName = spec.data_ref ? spec.data_ref.split(":")[1] : null;
  tabs = [];
  if (dataFile) tabs.push({ key: "data", title: "data", file: dataFile, name: dataName });
  for (const p of spec.panels) {
    tabs.push({
      key: `panel:${p.name}`,
      title: `${spec.labels[p.name] ?? p.name}: ${p.name}`,
      file: p.file,
      line: p.line,
      panel: p.name,
    });
  }
  tabs.push({ key: "layout", title: "layout", file: "fig.toml" });

  $("tabs").innerHTML = tabs.map((t) =>
    `<button class="tab" data-key="${t.key}">${t.title}<span class="dot" hidden>•</span></button>`).join("");
  for (const el of $("tabs").children) {
    el.addEventListener("click", () => selectTab(el.dataset.key));
  }
  if (first || !tabs.some((t) => t.key === active?.key)) selectTab("layout");
  else paintTabs();
}

function paintTabs() {
  for (const el of $("tabs").children) {
    const tab = tabs.find((t) => t.key === el.dataset.key);
    el.classList.toggle("on", tab.key === active?.key);
    const buf = buffers.get(tab.file);
    el.querySelector(".dot").hidden = !buf || buf.clean;
  }
}

async function selectTab(key) {
  const tab = tabs.find((t) => t.key === key);
  if (!tab) return;
  active = tab;
  await openFile(tab.file);
  if (cm) {
    const line = tab.line ? tab.line - 1 : 0;
    cm.setCursor({ line, ch: 0 });
    cm.scrollIntoView({ line: Math.max(line - 2, 0), ch: 0 }, 40);
    cm.focus();
  }
  $("editor-path").textContent = tab.line ? `${tab.file}:${tab.line}` : tab.file;
  paintTabs();
  highlightPanel(tab.panel ?? null);
  refreshEditorButtons();
}

/* ---------- buffers ---------- */

function modeFor(file) {
  const dot = file.lastIndexOf(".");
  return MODES[file.slice(dot)] ?? null;
}

async function openFile(file) {
  let buf = buffers.get(file);
  if (!buf) {
    const res = await fetch(`/api/file?path=${encodeURIComponent(file)}`);
    if (!res.ok) {
      showError((await res.json()).detail ?? res.statusText);
      return;
    }
    const state = await res.json();
    buf = {
      digest: state.digest,
      diskDigest: state.digest,
      clean: true,
      undoDepth: state.undo_depth,
      text: state.text,
    };
    if (cm) {
      buf.doc = CodeMirror.Doc(state.text, modeFor(file));
      buf.generation = buf.doc.changeGeneration(true);
    }
    buffers.set(file, buf);
  }
  if (cm) cm.swapDoc(buf.doc);
  else $("editor").value = buf.text;
  showEditorNote(buf);
}

function currentBuffer() { return active ? buffers.get(active.file) : null; }

function currentText() {
  const buf = currentBuffer();
  if (!buf) return "";
  return cm ? buf.doc.getValue() : $("editor").value;
}

function markDirty() {
  const buf = currentBuffer();
  if (!buf) return;
  buf.clean = cm ? buf.doc.isClean(buf.generation) : buf.text === $("editor").value;
  paintTabs();
  refreshEditorButtons();
  showEditorNote(buf);
}

function showEditorNote(buf) {
  const note = $("editor-note");
  if (!buf) { note.textContent = ""; return; }
  if (buf.diskDigest !== buf.digest) {
    note.textContent = "changed on disk — use reload to pick it up";
    note.className = "note warn";
  } else if (!buf.clean) {
    note.textContent = "unsaved";
    note.className = "note warn";
  } else {
    note.textContent = "saved";
    note.className = "note";
  }
}

function refreshEditorButtons() {
  const buf = currentBuffer();
  $("save").disabled = !buf || buf.clean;
  $("undo-save").disabled = !buf || !buf.undoDepth;
  $("revert").disabled = !buf;
}

/* ---------- save / undo ---------- */

async function save() {
  const buf = currentBuffer();
  if (!buf || buf.clean) return;
  const file = active.file;
  const text = currentText();
  const res = await fetch(`/api/file?path=${encodeURIComponent(file)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, if_match: buf.digest }),
  });
  if (res.status === 409) {
    // Someone else wrote it. Keep the buffer -- losing typing is worse than a stale file.
    buf.diskDigest = null;
    showError((await res.json()).detail);
    showEditorNote(buf);
    status(`cannot save: ${file} changed on disk`);
    return;
  }
  if (!res.ok) {
    showError((await res.json()).detail ?? res.statusText);
    return;
  }
  const state = await res.json();
  buf.digest = state.digest;
  buf.diskDigest = state.digest;
  buf.text = text;
  buf.undoDepth = state.undo_depth;
  buf.clean = true;
  if (cm) buf.generation = buf.doc.changeGeneration(true);
  clearError();
  paintTabs();
  refreshEditorButtons();
  showEditorNote(buf);
  status(`saved ${file}`);
  // The watcher will notice and push a change; the redraw happens from there.
}

async function undoSave() {
  const buf = currentBuffer();
  if (!buf) return;
  const file = active.file;
  const res = await fetch(`/api/file/undo?path=${encodeURIComponent(file)}`, { method: "POST" });
  if (!res.ok) {
    showError((await res.json()).detail ?? res.statusText);
    return;
  }
  const state = await res.json();
  applyDisk(file, state);
  status(`reverted ${file} to the previous save`);
}

async function revert() {
  const buf = currentBuffer();
  if (!buf) return;
  const file = active.file;
  const res = await fetch(`/api/file?path=${encodeURIComponent(file)}`);
  if (!res.ok) return;
  applyDisk(file, await res.json());
  status(`reloaded ${file} from disk`);
}

function applyDisk(file, state) {
  const buf = buffers.get(file);
  if (!buf) return;
  buf.digest = state.digest;
  buf.diskDigest = state.digest;
  buf.text = state.text;
  buf.undoDepth = state.undo_depth;
  buf.clean = true;
  if (cm && buf.doc) {
    const cursor = buf.doc.getCursor();
    buf.doc.setValue(state.text);
    buf.doc.setCursor(cursor);
    buf.generation = buf.doc.changeGeneration(true);
  }
  if (active && active.file === file && !cm) $("editor").value = state.text;
  clearError();
  paintTabs();
  refreshEditorButtons();
  showEditorNote(buf);
}

/* When a file we hold changes on disk: reload it silently if we have nothing unsaved,
   otherwise say so and leave the buffer alone. */
async function syncFromDisk(paths) {
  for (const file of paths) {
    const buf = buffers.get(file);
    if (!buf) continue;
    const res = await fetch(`/api/file?path=${encodeURIComponent(file)}`);
    if (!res.ok) continue;
    const state = await res.json();
    if (state.digest === buf.digest) {
      buf.undoDepth = state.undo_depth;
      refreshEditorButtons();
      continue;
    }
    if (buf.clean) applyDisk(file, state);
    else { buf.diskDigest = null; showEditorNote(buf); }
  }
}

/* ---------- preview ---------- */

function isFigure() { return $("panel").value === FIGURE; }

function highlightPanel(name) {
  const box = $("highlight");
  if (!name || !isFigure() || !spec) { box.hidden = true; return; }
  const panel = spec.panels.find((p) => p.name === name);
  if (!panel) { box.hidden = true; return; }
  const b = panel.inner;
  box.style.left = `${b.x}mm`;
  box.style.top = `${b.y}mm`;
  box.style.width = `${b.w}mm`;
  box.style.height = `${b.h}mm`;
  box.hidden = false;
}

/* ---------- zoom ----------
   True size is the point of the tool, so scaling is never silent: the effective percentage
   is always on screen and turns amber as soon as it is not 100%. `fit` only ever shrinks --
   enlarging a figure you are about to judge line weights on would be actively misleading. */

const PX_PER_MM = 96 / 25.4;

/* The natural size comes from the mm the SVG itself declares, not from the laid-out box.
   #frame is a block inside #zoomer, and #zoomer's width is what the previous call set to
   natural x scale -- so measuring the box would feed the scale back into its own input and
   the figure would shrink a little more on every call. */
function naturalSize() {
  const svg = $("stage").querySelector("svg");
  if (!svg) return null;
  const w = parseFloat(svg.getAttribute("width"));
  const h = parseFloat(svg.getAttribute("height"));
  if (!(w > 0) || !(h > 0)) return null;
  return { w: w * PX_PER_MM, h: h * PX_PER_MM };
}

function applyZoom() {
  const natural = naturalSize();
  if (!natural) return;
  const frame = $("frame");
  const zoomer = $("zoomer");
  const main = frame.closest("main");

  // clientWidth includes the padding, so take it from the computed style rather than
  // repeating the number here.
  const pad = getComputedStyle(main);
  const mode = $("zoom").value;
  const room = {
    w: main.clientWidth - parseFloat(pad.paddingLeft) - parseFloat(pad.paddingRight),
    h: main.clientHeight - parseFloat(pad.paddingTop) - parseFloat(pad.paddingBottom),
  };
  const fitScale = Math.min(1, room.w / natural.w, room.h / natural.h);
  const scale = Math.max(mode === "fit" ? fitScale : Number(mode), 0.05);

  frame.style.width = `${natural.w}px`;
  frame.style.height = `${natural.h}px`;
  frame.style.transform = scale === 1 ? "" : `scale(${scale})`;
  zoomer.style.width = `${natural.w * scale}px`;
  zoomer.style.height = `${natural.h * scale}px`;

  const percent = Math.round(scale * 100);
  const note = $("zoom-note");
  note.textContent = `${percent}%`;
  note.classList.toggle("scaled", percent !== 100);
  note.title =
    (percent === 100
      ? "true size"
      : "not true size — judge line weights and type sizes at 100%") +
    `\nfigure ${Math.round(natural.w)}x${Math.round(natural.h)}px / room ${Math.round(room.w)}x${Math.round(room.h)}px` +
    `\nfit would be ${Math.round(fitScale * 100)}%`;
}

function applyFilter() {
  const mode = $("filter").value;
  const stage = $("stage");
  stage.style.filter =
    mode === "none" ? "" : mode === "grayscale" ? "grayscale(1)" : `url(#${mode})`;
}

async function draw(note = "") {
  if (drawing) { pending = true; return; }
  drawing = true;
  const figure = isFigure();
  const name = $("panel").value;
  $("size-fields").hidden = figure;  // when composing, the solver owns the size
  const query = new URLSearchParams({ w: $("w").value, h: $("h").value });
  const url = figure ? "/api/figure.svg" : `/api/panel/${name}.svg?${query}`;
  $("pdf").href = figure ? "/api/figure.pdf" : `/api/panel/${name}.pdf?${query}`;

  $("stage").classList.add("stale");
  const t0 = performance.now();
  let res, body;
  try {
    res = await fetch(url);
    body = await res.text();
  } catch (err) {
    $("stage").classList.remove("stale");
    drawing = false;
    status(`server unreachable: ${err}`);
    return;
  }
  const ms = Math.round(performance.now() - t0);
  $("stage").classList.remove("stale");

  if (res.ok) {
    clearError();
    // spec 7.2: drop the output SVG straight into the DOM
    $("stage").innerHTML = body;
    applyFilter();
    applyZoom();
    highlightPanel(active?.panel ?? null);
    const failed = (res.headers.get("X-Figalign-Errors") || "").split(",").filter(Boolean);
    if (failed.length) {
      showError(`panels that failed to draw: ${failed.join(", ")}\n(traceback is shown in the cell)`);
    }
    const passes = res.headers.get("X-Figalign-Passes");
    const conv = res.headers.get("X-Figalign-Converged");
    const align =
      figure && passes
        ? ` — aligned in ${passes} pass${passes === "1" ? "" : "es"}${conv === "0" ? ", not converged" : ""}`
        : "";
    status(`${figure ? "figure" : name} — ${ms}ms${align}${note}`);
  } else {
    let detail = body;
    try { detail = JSON.parse(body).detail ?? body; } catch (_) {}
    showError(detail);
    status(`failed: ${figure ? "figure" : name} — ${ms}ms${note}`);
  }
  drawing = false;
  if (pending) { pending = false; draw(note); }
}

/* ---------- watch ---------- */

function connect(delay = 500) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const socket = new WebSocket(`${proto}://${location.host}/ws`);
  socket.addEventListener("open", () => {
    $("link").textContent = "watching";
    $("link").className = "live";
  });
  socket.addEventListener("message", async (event) => {
    const msg = JSON.parse(event.data);
    if (msg.kind !== "change") return;
    await syncFromDisk(msg.paths);
    const label = SCOPE_LABEL[msg.scope] ?? msg.scope;
    if (await loadSpec()) draw(` — ${label} change picked up (${msg.paths.join(", ")})`);
  });
  socket.addEventListener("close", () => {
    $("link").textContent = "reconnecting";
    $("link").className = "down";
    setTimeout(() => connect(Math.min(delay * 2, 5000)), delay);
  });
  socket.addEventListener("error", () => socket.close());
}

/* ---------- wiring ---------- */

if (window.CodeMirror) {
  cm = CodeMirror.fromTextArea($("editor"), {
    lineNumbers: true,
    // The column is deliberately narrow so the preview keeps room for true size; without
    // wrapping, ordinary Python lines would need constant horizontal scrolling.
    lineWrapping: true,
    indentUnit: 4,
    // No LSP, no completion: this is for nudging an axis range while watching the preview
    // (spec 4, 7.1).
    extraKeys: { "Cmd-S": save, "Ctrl-S": save },
  });
  cm.on("change", markDirty);
} else {
  // The CDN is unreachable. A plain textarea still edits files, which is the point.
  $("editor").addEventListener("input", markDirty);
  status("CodeMirror unavailable — editing in a plain textarea");
}

$("panel").addEventListener("change", () => { draw(); highlightPanel(active?.panel ?? null); });
$("reload").addEventListener("click", () => draw());
$("filter").addEventListener("change", applyFilter);
$("zoom").addEventListener("change", applyZoom);
window.addEventListener("resize", applyZoom);
$("save").addEventListener("click", save);
$("undo-save").addEventListener("click", undoSave);
$("revert").addEventListener("click", revert);
/* ---------- split ---------- */

const WIDTH_KEY = "figalign.editorWidth";

function setEditorWidth(px) {
  const max = Math.max(window.innerWidth - 360, 320);
  const width = Math.min(Math.max(px, 280), max);
  document.documentElement.style.setProperty("--editor-w", `${width}px`);
  localStorage.setItem(WIDTH_KEY, String(width));
  if (cm) cm.refresh();
  applyZoom();
}

/* Default so the preview column still fits the figure at true size: 1mm is 96/25.4 CSS px,
   plus the padding around the stage. */
function defaultEditorWidth() {
  const stored = Number(localStorage.getItem(WIDTH_KEY));
  if (stored) return stored;
  const figureMm = spec?.figure?.width_mm ?? spec?.preset?.width_mm ?? 180;
  const needed = figureMm * 96 / 25.4 + 80;
  return Math.max(window.innerWidth - needed, 380);
}

$("divider").addEventListener("mousedown", (event) => {
  event.preventDefault();
  const startX = event.clientX;
  const startWidth = $("editor-pane").getBoundingClientRect().width;
  $("divider").classList.add("dragging");
  document.body.classList.add("dragging");

  const move = (e) => setEditorWidth(startWidth + (e.clientX - startX));
  const done = () => {
    $("divider").classList.remove("dragging");
    document.body.classList.remove("dragging");
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", done);
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", done);
});

$("divider").addEventListener("dblclick", () => {
  localStorage.removeItem(WIDTH_KEY);
  setEditorWidth(defaultEditorWidth());
});

$("toggle-editor").addEventListener("click", () => {
  const hidden = !$("editor-pane").hidden;
  $("editor-pane").hidden = hidden;
  $("divider").hidden = hidden;
  if (!hidden && cm) cm.refresh();
  applyZoom();
});
for (const id of ["w", "h"]) {
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") draw(); });
}
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); }
});

loadSpec().then((ok) => {
  setEditorWidth(defaultEditorWidth());
  if (ok) draw();
  connect();
});
</script>
</body>
</html>
